name: ShipStack delete approved post
on:
  push:
    paths:
      - news-single/delete-request.json
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete approved Instagram media
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          MEDIA_ID=$(python -c 'import json; print(json.load(open("news-single/delete-request.json"))["instagram_media_id"])')
          RESPONSE=$(curl --fail-with-body -sS -X DELETE "https://graph.facebook.com/v23.0/$MEDIA_ID" --data-urlencode "access_token=$META_TOKEN")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"success":true'
          echo "CONFIRMED Instagram deletion: $MEDIA_ID"
