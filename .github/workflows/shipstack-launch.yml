name: ShipStack launch
# Posts ONE launch post per run (logo + Story, news, or dsa) from reels/shipstack/launch/.
# Manual only. Nothing is posted unless "publish" is ticked. reels/shipstack/announce.py checks the
# posting plan against the journal and the live account, journals before media_publish, and never
# posts a key twice. "override_daily_cap" lifts only the 12/day cap (owner decision), never the 60-min gap.
on:
  workflow_dispatch:
    inputs:
      post:
        description: Which launch post
        type: choice
        options: [logo, news, dsa]
        default: logo
      publish:
        description: Post to Instagram (leave off for a dry run)
        type: boolean
        default: false
      override_daily_cap:
        description: Lift the 12/day cap for this launch post (the 60-min gap still applies)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # release assets + reels/state.json journal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check the posting plan (journal)
        env:
          POST: ${{ inputs.post }}
          OVERRIDE: ${{ inputs.override_daily_cap }}
        run: python -m reels.shipstack.announce --post "$POST" --base-url https://example.invalid/ --dry-run $([ "$OVERRIDE" = true ] && echo --override-daily-cap)
      - name: Host the launch files as public release assets
        if: inputs.publish
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="shipstack-launch"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "ShipStack launch" --notes "Launch assets for .github/workflows/shipstack-launch.yml" --latest=false
          gh release upload "$TAG" reels/shipstack/launch/*.mp4 reels/shipstack/launch/*.jpg --clobber
          BASE="https://github.com/$GH_REPO/releases/download/$TAG/"
          for f in reels/shipstack/launch/*.mp4 reels/shipstack/launch/*.jpg; do
            curl --fail --location --range 0-1023 --output /dev/null "$BASE$(basename "$f")"
          done
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Publish (live account check; journal is pushed before media_publish)
        if: inputs.publish
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BASE: ${{ steps.host.outputs.base }}
          POST: ${{ inputs.post }}
          OVERRIDE: ${{ inputs.override_daily_cap }}
        run: |
          git config user.name autopost-bot
          git config user.email bot@users.noreply.github.com
          python -m reels.shipstack.announce --post "$POST" --base-url "$BASE" $([ "$OVERRIDE" = true ] && echo --override-daily-cap)
