name: ShipStack single-news sample
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the explicitly approved verified sample (false = validate only)"
        type: boolean
        default: false
  push:
    paths:
      - "news-single/sample.json"
      - "news-single/images/SHIPNEWS-20261119-001.png"
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  single-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: Validate or publish reviewed sample
        id: publish
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish }}
        run: python news-single/publish.py
      - name: Persist journal even on ambiguous outcome
        if: always()
        run: |
          git config user.name "shipstack-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news-single/journal.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ShipStack single-news publication attempt"
          for attempt in 1 2 3 4; do
            git pull --rebase -q && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::Journal could not be saved. STOP automatic retries; reconcile Instagram manually."
          exit 1
