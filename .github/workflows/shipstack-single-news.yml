name: ShipStack single-news sample
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish only an explicitly approved verified sample"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  single-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: Validate or publish reviewed sample
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLISH: ${{ inputs.publish }}
        run: python news-single/publish.py
      - name: Persist journal
        if: always()
        run: |
          git config user.name "shipstack-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news-single/journal.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ShipStack single-news publication attempt"
          git pull --rebase -q
          git push
