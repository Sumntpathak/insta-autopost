name: ShipStack persistent preview render

on:
  workflow_dispatch:
    inputs:
      reel:
        description: Preview format
        type: choice
        options: [lab01, lab02, ring, strings, balloon]
        default: lab01
      episode:
        description: Deterministic episode number
        type: number
        default: 1
  push:
    paths:
      - "render-env/**"
      - "reels/shipstack/**"
      - "reels/verify.py"
      - ".github/workflows/shipstack-preview.yml"

permissions:
  contents: read

concurrency:
  group: shipstack-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REEL: ${{ inputs.reel || 'lab01' }}
      EPISODE: ${{ inputs.episode || 1 }}
    steps:
      - uses: actions/checkout@v4

      - name: Build reusable rendering environment
        uses: docker/setup-buildx-action@v3

      - name: Build preview image with persistent layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: render-env/Dockerfile
          load: true
          tags: shipstack-preview:ci
          cache-from: type=gha,scope=shipstack-preview
          cache-to: type=gha,mode=max,scope=shipstack-preview

      - name: Render preview
        run: |
          mkdir -p preview-out
          docker run --rm \
            -e REEL="$REEL" -e EPISODE="$EPISODE" \
            -v "$PWD/preview-out:/workspace/preview-out" \
            shipstack-preview:ci \
            sh -lc 'python -m reels.shipstack --format "$REEL" --episode "$EPISODE" --out preview-out/shipstack-preview.mp4 && python reels/verify.py preview-out/shipstack-preview.mp4'

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipstack-preview-${{ github.run_id }}
          path: preview-out/shipstack-preview.mp4
          retention-days: 14
