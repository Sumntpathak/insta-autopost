name: Pythonic Life — overnight 10
on:
  push:
    branches: [main]
    paths: ['reels/pythonic/batch.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the explicit batch
        id: manifest
        run: |
          python - <<'PY'
          import json,os
          data=json.load(open('reels/pythonic/batch.json'))
          if not data.get('enabled'):raise SystemExit('Batch disabled')
          assert len(data['items'])==data['count']==10
          assert len({x['id'] for x in data['items']})==10
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('matrix='+json.dumps({'include':data['items']})+'\n')
          PY
  render:
    name: Render ${{ matrix.id }} · ${{ matrix.scene }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r reels/pythonic/requirements.txt
      - name: Render and validate
        env:
          SCENE: ${{ matrix.scene }}
          VARIANT: ${{ matrix.variant }}
          ITEM_ID: ${{ matrix.id }}
        run: |
          python reels/pythonic/render.py --scene "$SCENE" --variant "$VARIANT" --out "reels/out/$ITEM_ID.mp4"
          python reels/verify.py "reels/out/$ITEM_ID.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: pythonic-${{ matrix.id }}-${{ github.run_id }}
          path: reels/out/${{ matrix.id }}.mp4*
          retention-days: 14
  publish:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: autopost
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: pythonic-*-${{ github.run_id }}
          path: reels/out/pythonic
          merge-multiple: true
      - name: Configure posting journal
        run: |
          git config user.name autopost-bot
          git config user.email bot@users.noreply.github.com
      - name: Publish ten validated clips with a shared journal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python reels/pythonic/publish.py --spacing 45
