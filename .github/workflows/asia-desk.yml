name: Asia Desk verified carousel publisher
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the reviewed edition (false = validation only)"
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  asia-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed edition before any Meta calls
        run: |
          python - <<'PY'
          import datetime, json, pathlib
          root = pathlib.Path("asia-desk")
          data = json.loads((root / "edition.json").read_text())
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5, minutes=30))).date().isoformat()
          assert data["date"] == today, f"Stale edition {data['date']}; today is {today}"
          assert data["id"] == "ASIA-" + today.replace("-", ""), "Edition ID/date mismatch"
          stories = data["stories"]
          assert len(stories) == 7, "Expected exactly seven verified stories"
          urls = [s["url"] for s in stories]
          assert len(set(urls)) == 7, "Duplicate source URLs"
          for s in stories:
              assert s.get("headline") and s.get("source") and s.get("time"), "Missing attribution"
              assert s["url"].startswith("https://"), "Original HTTPS source required"
              assert s.get("verified") is True, "Every story must be manually/editorially verified"
          slides = sorted((root / "slides").glob("*.jpg"))
          assert len(slides) == 8, "Need eight publication-ready JPG slides"
          print("Edition manifest and assets pass structural validation; factual review is a separate requirement.")
          PY
      - name: Publish approved edition through existing journal
        if: inputs.publish == true
        run: python asia-desk/publish.py
      - name: Save publishing journal
        if: inputs.publish == true
        run: |
          git config user.name autopost-bot
          git config user.email bot@users.noreply.github.com
          git add asia-desk news-pilot reels/state.json posted.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Journal Asia Desk publication"
          for attempt in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
