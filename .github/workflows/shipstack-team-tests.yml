name: ShipStack team tests
on:
  pull_request:
    paths: ['team/**', '.github/workflows/shipstack-team*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow>=11,<14'
      - run: python -m unittest discover -s team/tests -v
