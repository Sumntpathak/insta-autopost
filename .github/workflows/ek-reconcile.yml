name: Reconcile staircase Instagram batch
on:
  push:
    branches: [main]
    paths: ['staircase/reconcile.py']
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: autopost
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconcile pending Instagram containers
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git config user.name autopost-bot
          git config user.email bot@users.noreply.github.com
          python staircase/reconcile.py
      - name: Collect Instagram Insights
        if: always()
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python reels/campaign.py insights
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staircase-insights
          path: reels/out/insights.json
