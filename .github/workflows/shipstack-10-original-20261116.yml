name: ShipStack ten original physics reels
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shipstack-10-original-20261116.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      BATCH_MANIFEST: reels/pythonic/shipstack-original-10.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r reels/pythonic/requirements.txt
      - name: Configure durable publishing journal
        run: |
          git config user.name autopost-bot
          git config user.email bot@users.noreply.github.com
      - name: Build ten original briefs and render unique deterministic simulations
        run: |
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          scenes=['pl-ring','pl-marble','pl-last','pl-floor','pl-balloon','pl-ring','pl-marble','pl-last','pl-floor','pl-balloon']
          hooks=['Which ball escapes first?','Predict the marble winner.','Who survives the spinning blade?','Which ball survives the falling floor?','Which balloon pops first?','One ring. One final escape.','Can you predict the closest finish?','Last ball standing: round two.','Only one tile survives.','Which balloon lasts longest?']
          items=[]
          seen=set()
          out=Path('reels/out/pythonic');out.mkdir(parents=True,exist_ok=True)
          for i,(scene,hook) in enumerate(zip(scenes,hooks),1):
              ident=f'SS-20261116-ORIG-{i:02d}'
              seed=91000+i*1777
              variant=i%2
              file=out/(ident+'.mp4')
              subprocess.run(['python','reels/pythonic/render.py','--scene',scene,'--variant',str(variant),'--seed',str(seed),'--out',str(file)],check=True)
              digest=hashlib.sha256(file.read_bytes()).hexdigest()
              if digest in seen:raise RuntimeError('Duplicate rendered video in this batch: '+ident)
              seen.add(digest)
              items.append(dict(id=ident,scene=scene,variant=variant,seconds=15,caption=hook+'\n\nMake your prediction before the result. Did you get it right?\n\n@shipstack_ #satisfyingphysics #marblerace #physicsreels',collection='shipstack-original'))
          Path('reels/pythonic/shipstack-original-10.json').write_text(json.dumps(dict(batch_id='shipstack-original-20261116',enabled=True,count=10,items=items),indent=2))
          print('Verified 10 unique rendered files',flush=True)
          PY
      - name: Publish ten reels with journal duplicate protection
        run: python reels/pythonic/publish.py --dir reels/out/pythonic --spacing 35
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipstack-original-10-${{ github.run_id }}
          path: |
            reels/out/pythonic/*.mp4
            reels/pythonic/shipstack-original-10.json
          retention-days: 14
