name: Facebook Page access check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/facebook-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check existing Facebook credentials without publishing
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          page=os.environ.get('FB_PAGE_ID','').strip()
          explicit=os.environ.get('FB_PAGE_TOKEN','').strip()
          token=explicit or os.environ.get('META_TOKEN','').strip()
          problems=[]
          if not page: problems.append('FB_PAGE_ID is not configured')
          if not token: problems.append('FB_PAGE_TOKEN is not configured')
          elif token.startswith('IG'): problems.append('Existing token is Instagram-only; a Facebook Page token is needed')
          if problems:
              print('FACEBOOK_READY=false')
              for problem in problems: print(problem)
          else:
              url='https://graph.facebook.com/v23.0/'+urllib.parse.quote(page,safe='')+'?fields=id,name'
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(request,timeout=45) as response: data=json.load(response)
                  print('FACEBOOK_READY=true')
                  print('Configured Page: '+str(data.get('name'))+' ('+str(data.get('id'))+')')
              except urllib.error.HTTPError as error:
                  print('FACEBOOK_READY=false')
                  print('Facebook API rejected the Page check: HTTP '+str(error.code))
          PY
