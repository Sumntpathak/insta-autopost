name: Instagram autopost
on:
  schedule:
    # GitHub cron is UTC and can start late; odd minutes avoid the top-of-hour rush.
    - cron: "7 3 * * *"    # 08:37 IST, morning slot
    - cron: "37 13 * * *"  # 19:07 IST, evening slot
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post now by id (e.g. S001). Leave empty for the next due slot."
        required: false
      dry_run:
        description: "Only check token + image URLs, do not post"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: autopost   # never run two posting jobs at once (prevents double posts)
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python post.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
      - name: Save posted log
        if: always()
        run: |
          git config user.name "autopost-bot"; git config user.email "bot@users.noreply.github.com"
          git add posted.json && git commit -m "Log post $(date -u +%F)" && git pull --rebase -q && git push || echo "nothing to log"
