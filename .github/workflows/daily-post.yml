name: Instagram autopost
on:
  schedule:
    # GitHub cron is UTC and can start late; odd minutes avoid the top-of-hour rush.
    - cron: "7 3 * * *"    # 08:37 IST, morning slot
    - cron: "37 13 * * *"  # 19:07 IST, evening slot
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post now by an unpublished ID from schedule.json. Leave empty for the next due slot."
        required: false
      dry_run:
        description: "Only check token + image URLs, do not post"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: autopost   # never run two posting jobs at once (prevents double posts)
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check reel trial
        id: trial
        run: echo "active=$(python reels/campaign.py active)" >> "$GITHUB_OUTPUT"
      - run: python post.py
        if: steps.trial.outputs.active != 'true'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
      - name: Save posted log
        if: always()
        run: |
          git config user.name "autopost-bot"; git config user.email "bot@users.noreply.github.com"
          git add posted.json
          if git diff --cached --quiet; then echo "nothing to log"; exit 0; fi
          git commit -m "Log post $(date -u +%F)"
          # posted.json is the only double-post guard: a lost push must fail the run, not pass silently.
          for attempt in 1 2 3 4; do
            git pull --rebase -q && git push && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 5))
          done
          echo "::error::posted.json could not be pushed; the next run may re-post this item"; exit 1
