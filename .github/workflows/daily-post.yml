name: Daily Instagram post
on:
  schedule:
    - cron: "15 13 * * *"   # 18:45 IST (GitHub can run a few minutes late)
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post now by id (e.g. T01). Leave empty for today's scheduled post."
        required: false
      dry_run:
        description: "Only check token + image URLs, do not post"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python post.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
      - name: Save posted log
        run: |
          git config user.name "autopost-bot"; git config user.email "bot@users.noreply.github.com"
          git add posted.json && git commit -m "Log post $(date -u +%F)" && git push || echo "nothing to log"
