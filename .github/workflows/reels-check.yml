name: Reel validation
on:
  pull_request:
    paths: ['reels/**', '.github/workflows/reels*.yml', '.github/workflows/daily-post.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reels/package-lock.json
      - run: python -m unittest discover -s reels/tests -v
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - run: npm ci --prefix reels
      - run: |
          node reels/render.mjs spinner 123 reels/out/preview.mp4
          python reels/verify.py reels/out/preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: reels/out/preview.mp4
          retention-days: 14
