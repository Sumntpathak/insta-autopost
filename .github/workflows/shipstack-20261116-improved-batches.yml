name: Publish improved 16-Nov batches
on:
  workflow_dispatch:
    inputs:
      batch:
        type: choice
        options:
          - winners
          - saves
          - series
        default: winners
        description: Which improved batch to render and publish (10 reels)
      dry_run:
        type: boolean
        default: false
        description: Render only, do not publish
permissions:
  contents: write
concurrency:
  group: improved-batch
  cancel-in-progress: false
jobs:
  publish-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BATCH: ${{ inputs.batch }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r reels/pythonic/requirements.txt
      - name: Select batch manifest
        id: select
        run: |
          case "$BATCH" in
            winners) MANIFEST="reels/pythonic/batch-20261116-01-winners.json" ;;
            saves)   MANIFEST="reels/pythonic/batch-20261116-02-saves.json" ;;
            series)  MANIFEST="reels/pythonic/batch-20261116-03-series.json" ;;
            *) echo "Unknown batch"; exit 1 ;;
          esac
          echo "manifest=$MANIFEST" >> $GITHUB_OUTPUT
          echo "Using $MANIFEST"
          cat "$MANIFEST" | head -c 400
      - name: Render all 10 reels in batch
        env:
          BATCH_MANIFEST: ${{ steps.select.outputs.manifest }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest = Path(os.environ["BATCH_MANIFEST"])
          data = json.loads(manifest.read_text())
          out_dir = Path("reels/out/pythonic")
          out_dir.mkdir(parents=True, exist_ok=True)
          for item in data["items"]:
              out = out_dir / f"{item['id']}.mp4"
              if out.exists() and out.stat().st_size > 100_000:
                  print(f"SKIP already rendered {item['id']}")
                  continue
              scene = item["scene"]
              variant = item.get("variant", 0)
              cmd = [
                  "python", "reels/pythonic/render.py",
                  "--scene", scene,
                  "--variant", str(variant),
                  "--out", str(out)
              ]
              print("RENDER", " ".join(cmd), flush=True)
              subprocess.run(cmd, check=True)
          print("All renders complete")
          PY
      - name: Publish batch (or dry-run)
        if: env.DRY_RUN != 'true'
        env:
          BATCH_MANIFEST: ${{ steps.select.outputs.manifest }}
        run: |
          # Temporarily point the existing publisher at our new manifest
          export BATCH_MANIFEST="$BATCH_MANIFEST"
          python reels/pythonic/publish.py --dir reels/out/pythonic --spacing 35
      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        run: |
          ls -lh reels/out/pythonic/PL-20261116-*.mp4 || true
          echo "Dry run finished. No posts published."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: improved-batch-${{ inputs.batch }}-${{ github.run_id }}
          path: reels/out/pythonic/
          retention-days: 14
