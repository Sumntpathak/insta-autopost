name: ShipStack premium challenge reels batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shipstack-premium-10-20261116.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      BATCH_MANIFEST: reels/pythonic/shipstack-premium-10.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r reels/pythonic/requirements.txt
      - name: Configure publishing journal
        run: |
          git config user.name autopost-bot
          git config user.email bot@users.noreply.github.com
      - name: Render and enhance ten distinct challenge reels
        run: |
          python - <<'PY'
          import json,subprocess,hashlib,shutil
          from pathlib import Path
          out=Path('reels/out/pythonic');out.mkdir(parents=True,exist_ok=True)
          scenes=['pl-marble','pl-ring','pl-floor','pl-last','pl-balloon','pl-marble','pl-ring','pl-floor','pl-last','pl-balloon']
          hooks=['PICK YOUR MARBLE','ONLY ONE ESCAPES','WHO SURVIVES?','LAST BALL WINS','PREDICT THE POP','PHOTO FINISH?','ESCAPE CHALLENGE','FLOOR IS LAVA','FINAL SURVIVOR','ONE LAST POP']
          captions=[
          'Pick a marble before the race. Which one crosses first?',
          'Three rings. Which ball escapes? Predict before the first collision.',
          'The tiles are disappearing. Which ball will survive?',
          'Only one ball survives. Can you predict it?',
          'Which balloon pops first? Choose before the impact.',
          'A new marble race. Can you call the photo finish?',
          'One more escape puzzle. Who finds the opening?',
          'The floor is falling away. Who stays up?',
          'Watch the spinning obstacle. Who is last standing?',
          'Pick the balloon that lasts longest.']
          items=[];seen=set()
          for i,(scene,hook,caption) in enumerate(zip(scenes,hooks,captions),1):
              ident=f'SS-20261116-PREMIUM-{i:02d}'
              variant=i%2
              seed=275000+i*8317
              file=out/(ident+'.mp4')
              raw=out/(ident+'.raw.mp4')
              subprocess.run(['python','reels/pythonic/render.py','--scene',scene,'--variant',str(variant),'--seed',str(seed),'--out',str(raw)],check=True)
              # Preserve deterministic source physics, improve mobile legibility and visual rhythm:
              # dark cinematic contrast, subtle colored framing, high-contrast challenge headline,
              # and 15-second countdown progress bar. No unrelated music or artificial slow motion.
              palette=['0x00DFFF','0xFF51AE','0xFFD34B','0x65F1BA','0xA58BFF']
              accent=palette[(i-1)%5]
              title=hook.replace(':','').replace(chr(39),'')
              filt=(
                 'eq=contrast=1.09:saturation=1.18:brightness=-0.015,'
                 'drawbox=x=0:y=0:w=iw:h=205:color=black@0.77:t=fill,'
                 f'drawbox=x=35:y=212:w=1010:h=5:color={accent}@0.95:t=fill,'
                 f"drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='{title}':fontcolor=white:fontsize=64:x=(w-text_w)/2:y=75,"
                 f"drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ROUND {i:02d}  |  MAKE YOUR PICK':fontcolor={accent}:fontsize=30:x=(w-text_w)/2:y=155,"
                 'drawbox=x=40:y=1700:w=1000:h=8:color=white@0.14:t=fill,'
                 f'drawbox=x=40:y=1700:w=1000*min(t/15\\,1):h=8:color={accent}:t=fill'
              )
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(raw),'-vf',filt,
                 '-c:v','libx264','-preset','fast','-crf','19','-pix_fmt','yuv420p',
                 '-c:a','copy','-movflags','+faststart',str(file)],check=True)
              shutil.move(str(raw)+'.json',str(file)+'.json')
              raw.unlink()
              digest=hashlib.sha256(file.read_bytes()).hexdigest()
              if digest in seen:raise RuntimeError('Duplicate premium render '+ident)
              seen.add(digest)
              items.append(dict(id=ident,scene=scene,variant=variant,seconds=15,
                caption=caption+'\n\nComment your prediction before the reveal. Follow @shipstack_ for the next round.\n\n#satisfyingphysics #physicsreels #marblerace',
                collection='shipstack-premium'))
          Path('reels/pythonic/shipstack-premium-10.json').write_text(json.dumps(dict(batch_id='shipstack-premium-20261116',enabled=True,count=10,items=items),indent=2))
          print('RENDERED 10 PREMIUM UNIQUE FILES',flush=True)
          PY
      - name: Publish premium batch with duplicate protection
        run: python reels/pythonic/publish.py --dir reels/out/pythonic --spacing 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipstack-premium-10-${{ github.run_id }}
          path: |
            reels/out/pythonic/*.mp4
            reels/pythonic/shipstack-premium-10.json
          retention-days: 14
